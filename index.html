*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:var(--navy);color:#d9e5f4;padding:22px 14px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;gap:11px;align-items:center;padding:4px 9px 25px;color:white}.brandmark{width:38px;height:38px;background:#69a2ff;border-radius:11px;display:grid;place-items:center;color:#0e2c50;font-weight:900;font-size:18px}.brand strong{display:block;font-size:16px;letter-spacing:.2px}.brand small{color:#a9bfd9}.navlabel{font-size:10px;letter-spacing:1.4px;color:#8fa8c6;padding:14px 12px 7px}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:9px;padding:11px 12px;background:transparent;color:#d1deee;text-align:left}.nav button:hover,.nav button.active{background:#2a4d76;color:white}.nav .ico{width:19px;text-align:center;font-size:16px}.sidebarfoot{margin-top:auto;border-top:1px solid #315071;padding:15px 10px 2px;color:#a9bfd9;font-size:11px}.main{margin-left:248px;min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:15px;position:sticky;top:0;z-index:4}.crumb{font-size:12px;color:var(--muted)}.topbar h1{font-size:18px;margin:1px 0 0}.topactions{display:flex;align-items:center;gap:10px}.rolelabel{font-size:12px;color:var(--muted)}select,input,textarea{border:1px solid #d6e0eb;border-radius:8px;background:white;padding:9px 11px;color:var(--ink);min-width:0}select:focus,input:focus,textarea:focus{outline:2px solid #bcd5ff;border-color:#6b9bea}.role-select{max-width:205px}.avatar{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;background:#e7effb;color:var(--navy);font-weight:800}.content{padding:27px 30px 44px;max-width:1600px;margin:auto}.welcome{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.welcome h2{font-size:22px;margin:0 0 5px;letter-spacing:-.4px}.welcome p{margin:0;color:var(--muted)}.btn{border:1px solid #d4deea;background:white;border-radius:8px;padding:9px 13px;color:#30455f;font-weight:650;display:inline-flex;gap:7px;align-items:center;justify-content:center}.btn:hover{background:#f7faff}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.primary:hover{background:#225ac0}.btn.small{font-size:12px;padding:6px 9px}.btn.danger{color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat,.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stat{padding:18px 19px}.stathead{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.staticon{width:32px;height:32px;border-radius:9px;background:#edf3ff;color:var(--blue);display:grid;place-items:center;font-size:17px}.statvalue{font-size:27px;font-weight:780;letter-spacing:-.7px;margin:11px 0 4px}.statfoot{font-size:11px;color:var(--muted)}.layout2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:17px;margin-bottom:18px}.panel{padding:19px;min-width:0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panelhead h3{font-size:15px;margin:0}.panelhead p{margin:3px 0 0;font-size:12px;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;background:#edf1f6;color:#52657b;white-space:nowrap}.pill.green{background:#e5f6ef;color:#137553}.pill.amber{background:#fff2dc;color:#98600a}.pill.blue{background:#e8f0ff;color:#285ec0}.pill.red{background:#ffebec;color:#a62f3a}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#718197;font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:11px 10px;border-bottom:1px solid var(--line);font-weight:750}td{padding:13px 10px;border-bottom:1px solid #edf1f5;font-size:12px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafcff}.orderid{font-weight:800;color:#2459a8}.muted{color:var(--muted)}.productname{font-weight:700}.subline{display:block;font-size:11px;color:var(--muted);margin-top:2px}.progresslist{display:grid;gap:17px}.progressrow{display:grid;grid-template-columns:1fr auto;gap:6px}.progressrow .name{font-weight:650;font-size:12px}.progressrow .count{color:var(--muted);font-size:11px}.track{height:6px;background:#edf1f6;border-radius:99px;overflow:hidden;grid-column:1/-1}.fill{height:100%;border-radius:99px;background:#4b82e8}.stagegrid{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:10px;margin-bottom:19px}.stagecard{padding:15px 13px;border:1px solid var(--line);background:white;border-radius:11px;position:relative}.stagecard .stageico{font-size:18px;margin-bottom:12px}.stagecard .stagecount{font-size:24px;font-weight:800}.stagecard .stagelabel{font-size:11px;color:var(--muted);margin-top:2px}.stagecard:after{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:11px 11px 0 0;background:#8bb2fa}.stagecard:nth-child(2):after{background:#70a9e9}.stagecard:nth-child(3):after{background:#8a92ef}.stagecard:nth-child(4):after{background:#42bba0}.stagecard:nth-child(5):after{background:#d4a44c}.stagecard:nth-child(6):after{background:#8c9db1}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:180px}.toolbar select{min-width:140px}.empty{padding:32px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.notice{border:1px solid #d9e6fb;background:#f0f6ff;border-radius:10px;padding:12px 14px;color:#34577f;font-size:12px;margin-bottom:17px}.twoform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700;color:#465a70}.field input,.field select,.field textarea{width:100%}.field.full{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.detailgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.detailbox{background:#f7f9fc;border:1px solid var(--line);padding:14px;border-radius:9px}.detailbox small{display:block;color:var(--muted);margin-bottom:6px}.detailbox strong{font-size:17px}.customerrow{display:flex;align-items:center;gap:10px}.customericon{width:35px;height:35px;border-radius:10px;background:#e9f1ff;color:#275fb8;display:grid;place-items:center;font-weight:800}.footnote{font-size:11px;color:var(--muted);margin-top:14px}.mobilemenu{display:none}.toast{position:fixed;right:22px;bottom:22px;background:#173b60;color:white;padding:12px 17px;border-radius:9px;box-shadow:var(--shadow);z-index:20;max-width:360px}.modalback{position:fixed;inset:0;background:#10243d80;display:grid;place-items:center;padding:20px;z-index:15}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:white;border-radius:14px;padding:23px;box-shadow:0 20px 70px #08172b40}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.modalhead h2{margin:0;font-size:19px}.xbtn{border:0;background:#edf2f8;border-radius:8px;width:33px;height:33px;font-size:20px;color:#42556d}.tag{display:inline-block;background:#edf3ff;border-radius:5px;padding:3px 6px;font-size:10px;color:#365e9c}.trackingline{display:flex;align-items:center;gap:8px;margin:17px 0}.trackstep{flex:1;text-align:center;font-size:10px;color:var(--muted)}.trackstep .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;background:#e7edf4;color:#64758b}.trackstep.done .dot{background:#dff5eb;color:#147653}.trackstep.current .dot{background:#dce9ff;color:#245ec5}.trackstep .connector{height:2px;background:#e4eaf1;position:relative;top:-30px;left:60%;width:80%;z-index:-1}
@media(max-width:1150px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stagegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.layout2{grid-template-columns:1fr}}@media(max-width:760px){.sidebar{width:64px;padding:17px 8px}.brand{padding:3px 4px 24px}.brandtext,.navlabel,.nav button .navtext,.sidebarfoot{display:none}.brandmark{width:40px;height:40px}.nav button{justify-content:center;padding:12px 5px}.nav .ico{font-size:18px}.main{margin-left:64px}.topbar{padding:0 14px;height:64px}.content{padding:19px 14px 35px}.rolelabel{display:none}.role-select{max-width:132px}.welcome{align-items:flex-start}.welcome h2{font-size:20px}.stagegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{gap:9px}.stat{padding:14px}.statvalue{font-size:23px}.twoform,.detailgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:14px}.topbar h1{font-size:16px}}@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.stagegrid{gap:7px}.stagecard{padding:12px 9px}.stagecard .stagecount{font-size:21px}.topactions{gap:5px}.avatar{display:none}}
</style>

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">N</div><div class="brandtext"><strong>Northstar ERP</strong><small>Warehouse operations</small></div></div>
  <div class="navlabel">WORKSPACE</div>
  <nav class="nav" id="navigation">
    <button class="active" data-page="dashboard"><span class="ico">▦</span><span class="navtext">Overview</span></button>
    <button data-page="orders"><span class="ico">▤</span><span class="navtext">Customer Orders</span></button>
    <button data-page="receiving"><span class="ico">⇩</span><span class="navtext">Receiving</span></button>
    <button data-page="picking"><span class="ico">☷</span><span class="navtext">Picking</span></button>
    <button data-page="packing"><span class="ico">▣</span><span class="navtext">Packing</span></button>
    <button data-page="shipping"><span class="ico">➤</span><span class="navtext">Shipping</span></button>
    <button data-page="inventory"><span class="ico">▦</span><span class="navtext">Inventory</span></button>
    <button data-page="tracking"><span class="ico">⌖</span><span class="navtext">Order Tracking</span></button>
    <button data-page="customers"><span class="ico">♙</span><span class="navtext">Customers & Products</span></button>
    <button data-page="reports"><span class="ico">▥</span><span class="navtext">Reports</span></button>
  </nav>
  <div class="navlabel">SYSTEM</div>
  <nav class="nav"><button data-page="settings"><span class="ico">⚙</span><span class="navtext">Demo Settings</span></button></nav>
  <div class="sidebarfoot">DEMO ENVIRONMENT<br>Sample data only · v1.0</div>
</aside>
<main class="main">
  <header class="topbar"><div><div class="crumb">Operations / <span id="crumb">Overview</span></div><h1 id="pageTitle">Operations overview</h1></div><div class="topactions"><span class="rolelabel">View as</span><select class="role-select" id="roleSelect" aria-label="Choose demo role"><option>Administrator</option><option>Purchasing</option><option>Customer Service</option><option>Warehouse</option><option>Logistics</option><option>Inventory Controller</option><option>Management</option></select><div class="avatar" id="avatar">AD</div></div></header>
  <div class="content" id="content"></div>
</main>
</div>
<div id="overlay"></div><div id="toastHost" aria-live="polite"></div>
<script>
(function(){
"use strict";
const stageNames=["Receiving","Picking","Packing","Shipping","Delivered"];
const stageIcons=["⇩","☷","▣","➤","✓"];
const rolePages={
"Administrator":["dashboard","orders","receiving","picking","packing","shipping","inventory","tracking","customers","reports","settings"],
"Purchasing":["dashboard","receiving","inventory","customers","reports"],
"Customer Service":["dashboard","orders","tracking","customers"],
"Warehouse":["dashboard","receiving","picking","packing","inventory"],
"Logistics":["dashboard","shipping","tracking","orders"],
"Inventory Controller":["dashboard","inventory","receiving","reports","customers"],
"Management":["dashboard","reports","orders","inventory","tracking"]
};
const titles={dashboard:"Operations overview",orders:"Customer orders",receiving:"Receiving",picking:"Picking",packing:"Packing",shipping:"Shipping",inventory:"Inventory",tracking:"Order tracking",customers:"Customers & products",reports:"Reports & analytics",settings:"Demo settings"};
const seedProducts=[
{id:"SKU-1001",name:"Vitamin C 500 mg",customer:"All customers",tabletsPerBlister:10,tabletsPerCase:1000,onHand:15000,reorder:3000,location:"A-01-01",barcode:"4800001001001"},
{id:"SKU-1002",name:"Paracetamol 500 mg",customer:"All customers",tabletsPerBlister:10,tabletsPerCase:1000,onHand:28000,reorder:5000,location:"A-01-02",barcode:"4800001001002"},
{id:"SKU-1003",name:"Cetirizine 10 mg",customer:"Northwind Pharmacy",tabletsPerBlister:10,tabletsPerCase:500,onHand:9500,reorder:2000,location:"B-02-01",barcode:"4800001001003"},
{id:"SKU-1004",name:"Multivitamin tablets",customer:"All customers",tabletsPerBlister:12,tabletsPerCase:1200,onHand:7200,reorder:1500,location:"B-02-02",barcode:"4800001001004"},
{id:"SKU-1005",name:"Omeprazole 20 mg",customer:"Harbor Medical",tabletsPerBlister:10,tabletsPerCase:1000,onHand:4000,reorder:1000,location:"C-01-01",barcode:"4800001001005"}
];
const seedCustomers=[{name:"Northwind Pharmacy",code:"CUST-001",terms:"Net 30",products:["SKU-1001","SKU-1002","SKU-1003"]},{name:"Harbor Medical",code:"CUST-002",terms:"Net 15",products:["SKU-1001","SKU-1005"]},{name:"Pioneer Health",code:"CUST-003",terms:"Prepaid",products:["SKU-1002","SKU-1004"]}];
const seedOrders=[
{id:"ORD-26041",customer:"Northwind Pharmacy",productId:"SKU-1001",tablets:111000,blisters:11100,requested:"2026-10-22",priority:"High",stage:"Picking",assigned:"Warehouse A",received:111000,picked:0,packed:0,shipped:0,tracking:"NST-880041",carrier:"Pending assignment",created:"2026-10-21"},
{id:"ORD-26042",customer:"Harbor Medical",productId:"SKU-1005",tablets:24000,blisters:2400,requested:"2026-10-23",priority:"Normal",stage:"Receiving",assigned:"Unassigned",received:0,picked:0,packed:0,shipped:0,tracking:"NST-880042",carrier:"Pending assignment",created:"2026-10-21"},
{id:"ORD-26043",customer:"Pioneer Health",productId:"SKU-1002",tablets:50000,blisters:5000,requested:"2026-10-21",priority:"Urgent",stage:"Packing",assigned:"Warehouse B",received:50000,picked:50000,packed:0,shipped:0,tracking:"NST-880043",carrier:"Pending assignment",created:"2026-10-20"},
{id:"ORD-26044",customer:"Northwind Pharmacy",productId:"SKU-1003",tablets:12000,blisters:1200,requested:"2026-10-24",priority:"Normal",stage:"Shipping",assigned:"Warehouse A",received:12000,picked:12000,packed:12000,shipped:0,tracking:"NST-880044",carrier:"J&T Express",created:"2026-10-20"},
{id:"ORD-26045",customer:"Harbor Medical",productId:"SKU-1001",tablets:8000,blisters:800,requested:"2026-10-25",priority:"Low",stage:"Delivered",assigned:"Warehouse B",received:8000,picked:8000,packed:8000,shipped:8000,tracking:"NST-880045",carrier:"LBC",created:"2026-10-19"}
];
let state;
function freshState(){return {products:structuredClone(seedProducts),customers:structuredClone(seedCustomers),orders:structuredClone(seedOrders),events:[{time:new Date().toISOString(),text:"Demo workspace initialized",user:"System"}]}}
function load(){try{let v=localStorage.getItem("northstar-erp-demo-v1");if(v){const parsed=JSON.parse(v);if(parsed&&parsed.orders&&parsed.products&&parsed.customers)return parsed}}catch(e){}return freshState()}
state=load();
let role="Administrator",page="dashboard",searchTerm="",stageFilter="All",toastTimer;
function save(){try{localStorage.setItem("northstar-erp-demo-v1",JSON.stringify(state))}catch(e){}}
function log(text){state.events.unshift({time:new Date().toISOString(),text:text,user:role});state.events=state.events.slice(0,100);save()}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(n){return Number(n||0).toLocaleString("en-PH")}
function product(id){return state.products.find(p=>p.id===id)||state.products[0]}
function stageKey(s){return s==="Delivered"?"Delivered":s}
function stageClass(s){if(s==="Delivered")return "green";if(s==="Shipping"||s==="Packing")return "blue";if(s==="Picking"||s==="Receiving")return "amber";return ""}
function pill(s){return '<span class="pill '+stageClass(s)+'">'+esc(s)+'</span>'}
function orderBlisters(o){let p=product(o.productId);return Math.ceil(Number(o.tablets||0)/Math.max(1,Number(p.tabletsPerBlister||10)))}
function visibleOrders(){let list=state.orders.slice();if(role==="Customer Service")list=list.filter(o=>o.customer==="Northwind Pharmacy");if(role==="Purchasing")list=list.filter(o=>o.stage==="Receiving");if(role==="Warehouse")list=list.filter(o=>["Receiving","Picking","Packing"].includes(o.stage));if(role==="Logistics")list=list.filter(o=>["Shipping","Delivered"].includes(o.stage));if(role==="Inventory Controller")list=list.filter(o=>["Receiving","Delivered"].includes(o.stage));if(role==="Management")list=list.filter(o=>true);return list}
function stat(label,value,foot,icon){return '<div class="stat"><div class="stathead"><span>'+label+'</span><span class="staticon">'+icon+'</span></div><div class="statvalue">'+value+'</div><div class="statfoot">'+foot+'</div></div>'}
function panelHead(title,sub,action){return '<div class="panelhead"><div><h3>'+title+'</h3>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+(action||'')+'</div>'}
function btn(label,action,primary,small){return '<button class="btn '+(primary?'primary ':'')+(small?'small':'')+'" data-action="'+action+'">'+label+'</button>'}
function orderTable(list,actions){if(!list.length)return '<div class="empty"><strong>No orders found</strong>Try a different filter or create a new customer order.</div>';return '<div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer / product</th><th>Quantity</th><th>Required date</th><th>Stage</th><th>Assignee</th><th>Action</th></tr></thead><tbody>'+list.map(o=>'<tr><td><span class="orderid">'+esc(o.id)+'</span><span class="subline">'+esc(o.priority)+' priority</span></td><td><span class="productname">'+esc(o.customer)+'</span><span class="subline">'+esc(product(o.productId).name)+'</span></td><td><b>'+num(o.tablets)+'</b><span class="subline">'+num(orderBlisters(o))+' blisters</span></td><td>'+esc(o.requested)+'</td><td>'+pill(o.stage)+'</td><td>'+esc(o.assigned||"Unassigned")+'</td><td><div style="display:flex;gap:5px">'+btn("View","view:"+o.id,false,true)+(actions?btn("Advance","advance:"+o.id,false,true):"")+'</div></td></tr>').join("")+'</tbody></table></div>'}
function stageCount(s){return state.orders.filter(o=>o.stage===s).length}
function stages(){let names=["Receiving","Picking","Packing","Shipping","Delivered"];return '<div class="stagegrid">'+names.map((s,i)=>'<div class="stagecard"><div class="stageico">'+stageIcons[i]+'</div><div class="stagecount">'+stageCount(s)+'</div><div class="stagelabel">'+s+'</div></div>').join("")+'</div>'}
function dashboard(){let orders=visibleOrders();let open=orders.filter(o=>o.stage!=="Delivered").length;let tablets=orders.filter(o=>o.stage!=="Delivered").reduce((a,o)=>a+Number(o.tablets),0);let low=state.products.filter(p=>p.onHand<p.reorder).length;
let recent=orders.slice().sort((a,b)=>b.created.localeCompare(a.created)).slice(0,5);

return '<div class="welcome"><div><h2>Good day, '+esc(role)+'.</h2><p>Here’s your warehouse operation snapshot for today.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+btn("Export orders","export",false,false)+(rolePages[role].includes("orders")?btn("+ New order","neworder",true,false):"")+'</div></div>'+stagesBlock+'<div class="stats">'+stat("Open orders",num(open),"Across your permitted workspace","▤")+stat("Tablets in process",num(tablets),"Active order demand","▦")+stat("SKU count",num(state.products.length),"Product master records","▣")+stat("Low-stock alerts",num(low),low?"Requires replenishment":"All SKUs above reorder level","⚑")+'</div><div class="layout2"><section class="panel">'+panelHead("Recent customer orders","Live demo order queue",btn("View all","page:orders",false,true))+orderTable(recent,true)+'</section><section class="panel">'+panelHead("Work in progress","Order count by current stage","")+'<div class="progresslist">'+["Receiving","Picking","Packing","Shipping","Delivered"].map(s=>{let c=stageCount(s),pct=state.orders.length?Math.round(c/state.orders.length*100):0;return '<div class="progressrow"><span class="name">'+s+'</span><span class="count">'+c+' orders · '+pct+'%</span><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>'}).join("")+'</div><div class="footnote">Role-based view: '+esc(role)+'. Administrator can see all demo records.</div></section></div><section class="panel">'+panelHead("Recent activity","Audit-style log of demo actions","")+'<div class="progresslist">'+state.events.slice(0,4).map(e=>'<div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf1f5;padding:7px 0"><span>'+esc(e.text)+' <span class="muted">by '+esc(e.user)+'</span></span><span class="muted" style="white-space:nowrap">'+new Date(e.time).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+'</span></div>').join("")+'</div></section>'}

function newProduct(){showModal("Add product SKU",'<form id="newProductForm"><div class="twoform"><div class="field"><label>SKU *</label><input name="id" placeholder="SKU-1006" required></div><div class="field"><label>Product name *</label><input name="name" required></div><div class="field"><label>Tablets per blister *</label><input type="number" name="tabletsPerBlister" min="1" value="10" required></div><div class="field"><label>Tablets per case</label><input type="number" name="tabletsPerCase" min="1" value="1000" required></div><div class="field"><label>Opening stock (tablets)</label><input type="number" name="onHand" min="0" value="0" required></div><div class="field"><label>Reorder point</label><input type="number" name="reorder" min="0" value="1000" required></div><div class="field"><label>Customer assignment</label><select name="customer">'+['All customers'].concat(state.customers.map(c=>c.name)).map(c=>'<option>'+esc(c)+'</option>').join("")+'</select></div><div class="field"><label>Storage bin</label><input name="location" placeholder="A-01-03"></div><div class="field full"><label>Barcode (optional)</label><input name="barcode" placeholder="Product barcode"></div></div><div class="formactions"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary">Add SKU</button></div></form>');document.getElementById("newProductForm").addEventListener("submit",e=>{e.preventDefault();let fd=new FormData(e.target),id=String(fd.get("id")).trim();if(state.products.some(p=>p.id.toLowerCase()===id.toLowerCase())){toast("That SKU already exists.");return}let p={id:id,name:fd.get("name"),customer:fd.get("customer"),tabletsPerBlister:Math.max(1,Number(fd.get("tabletsPerBlister"))),tabletsPerCase:Math.max(1,Number(fd.get("tabletsPerCase"))),onHand:Math.max(0,Number(fd.get("onHand"))),reorder:Math.max(0,Number(fd.get("reorder"))),location:fd.get("location"),barcode:fd.get("barcode")||id};state.products.push(p);log("Added product SKU "+id);closeModal();render();toast("SKU added.")})}
function newCustomer(){showModal("Add customer account",'<form id="customerForm"><div class="twoform"><div class="field"><label>Customer name *</label><input name="name" required></div><div class="field"><label>Customer code *</label><input name="code" placeholder="CUST-004" required></div><div class="field"><label>Payment terms</label><select name="terms"><option>Net 30</option><option>Net 15</option><option>Prepaid</option><option>Net 45</option></select></div><div class="field"><label>Allowed products</label><select name="products" multiple size="5">'+state.products.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.id+" · "+p.name)+'</option>').join("")+'</select><small class="muted">Use Ctrl (Windows) to select multiple SKUs.</small></div></div><div class="formactions"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary">Add customer</button></div></form>');document.getElementById("customerForm").addEventListener("submit",e=>{e.preventDefault();let fd=new FormData(e.target),name=String(fd.get("name")).trim();if(state.customers.some(c=>c.name.toLowerCase()===name.toLowerCase())){toast("Customer already exists.");return}let products=Array.from(e.target.elements.products.selectedOptions).map(x=>x.value);state.customers.push({name:name,code:fd.get("code"),terms:fd.get("terms"),products:products});log("Added customer "+name);closeModal();render();toast("Customer added.")})}
function reset(){if(!confirm("Restore the original sample data? This replaces changes stored in this browser."))return;state=freshState();save();log("Restored sample data");render();toast("Sample data restored.")}
function action(a){if(a==="close"){closeModal();return}if(a==="backdrop"){return}if(a==="neworder"){newOrder();return}if(a==="newproduct"){newProduct();return}if(a==="newcustomer"){newCustomer();return}if(a==="export"){exportOrders();return}if(a==="exportInventory"){let rows=[["SKU","Product","Customer","Tablets on hand","Tablets per blister","Blister equivalent","Reorder","Bin","Barcode"],...state.products.map(p=>[p.id,p.name,p.customer,p.onHand,p.tabletsPerBlister,Math.floor(p.onHand/p.tabletsPerBlister),p.reorder,p.location,p.barcode])];download("erp-inventory.csv",rows.map(r=>r.map(csvCell).join(",")).join("\r\n"),"text/csv;charset=utf-8");return}if(a==="exportActivity"){download("erp-activity.csv",[["Time","Actor","Activity"],...state.events.map(e=>[e.time,e.user,e.text])].map(r=>r.map(csvCell).join(",")).join("\r\n"),"text/csv;charset=utf-8");return}if(a==="backup"){download("erp-demo-backup.json",JSON.stringify(state,null,2),"application/json");return}if(a==="reset"){reset();return}if(a==="page:orders"){page="orders";searchTerm="";stageFilter="All";render();return}if(a.indexOf("page:")===0){page=a.split(":")[1];searchTerm="";render();return}if(a.indexOf("view:")===0){viewOrder(a.slice(5));return}if(a.indexOf("advance:")===0){advanceOrder(a.slice(8));return}if(a.indexOf("editproduct:")===0){editProduct(a.slice(12));return}}
document.addEventListener("click",function(e){let b=e.target.closest("[data-action]");if(b){if(b.dataset.action==="backdrop"&&e.target!==b)return;action(b.dataset.action)}})
document.getElementById("navigation").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(!b)return;page=b.dataset.page;searchTerm="";stageFilter="All";render()});
document.getElementById("roleSelect").addEventListener("change",e=>{role=e.target.value;if(!rolePages[role].includes(page))page="dashboard";render()});
document.getElementById("content").addEventListener("input",e=>{if(e.target.id==="orderSearch"){searchTerm=e.target.value;let start=e.target.selectionStart;render();let next=document.getElementById("orderSearch");if(next){next.focus();next.setSelectionRange(start,start)}}});
document.getElementById("content").addEventListener("change",e=>{if(e.target.id==="stageFilter"){stageFilter=e.target.value;render()}});
document.addEventListener("submit",e=>{if(e.target.id==="orderForm"||e.target.id==="productForm"||e.target.id==="newProductForm"||e.target.id==="customerForm")return});
render();
})();
</script>
</body>
